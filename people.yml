# Lab members. To add someone, copy a block, fill it in, and put their photo
# (square, ~600x600) in images/people/. `group` must be one of:
# Principal Investigator, Graduate Students, Undergraduate Researchers,
# Research Assistants, Alumni, Collaborators
# Collaborators are shown as compact cards without photos.

- name: Murat Kezer
  group: Principal Investigator
  # image: images/people/mkezer.jpg     
  bio: >
    Murat is an assistant professor in the Department of Psychology at Bilkent University.
    His research broadly examines how we perceive and understand others. His research uses dyadic designs, experimental methods, computational techniques, and large language models.

  links:
    - label: Email
      url: "mailto:mkezer@bilkent.edu.tr"   
    - label: Google Scholar
      url: "https://scholar.google.com/citations?user=AwitZwkAAAAJ&hl=en"
    - label: GitHub
      url: "https://github.com/mkezer"

